services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyrhythm
      POSTGRES_USER: studyrhythm
      POSTGRES_PASSWORD: studyrhythm_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyrhythm -d studyrhythm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
